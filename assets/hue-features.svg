<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#D97706"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#DB2777"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <text x="600" y="45" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#F7F7F4" text-anchor="middle">What Hue Can Do</text>

  <g transform="translate(60, 90)">
    <!-- Agentic IDE -->
    <rect x="0" y="0" width="540" height="150" fill="url(#card)" stroke="#333" rx="14"/>
    <rect x="0" y="0" width="6" height="150" fill="url(#accent1)" rx="14"/>
    <text x="30" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F7F7F4">Agentic IDE</text>
    <text x="30" y="70" font-family="system-ui, sans-serif" font-size="13.5" fill="#A1A1AA">Run Claude Code, Codex, OpenCode, Cursor, Kimi Code, GLM, Grok Build, DeepSeek Harness, Kilo Code, Zed Code side by side in live terminal panes.</text>
    <text x="30" y="98" font-family="system-ui, sans-serif" font-size="12.5" fill="#7C3AED">• Voice briefings · per-pane call signs (T1, T2…) · fanout to all panes</text>

    <!-- Jarvis Agents -->
    <rect x="600" y="0" width="540" height="150" fill="url(#card)" stroke="#333" rx="14"/>
    <rect x="600" y="0" width="6" height="150" fill="url(#accent2)" rx="14"/>
    <text x="630" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F7F7F4">Jarvis Agents</text>
    <text x="630" y="70" font-family="system-ui, sans-serif" font-size="13.5" fill="#A1A1AA">Build a team of background AI agents. Each has its own chat, tools, schedule and memory, runs in an isolated worktree, and returns reviewed results.</text>
    <text x="630" y="98" font-family="system-ui, sans-serif" font-size="12.5" fill="#059669">• Kill-on-crash containment · review flow · memory per seat</text>
  </g>

  <g transform="translate(60, 270)">
    <!-- Voice -->
    <rect x="0" y="0" width="540" height="150" fill="url(#card)" stroke="#333" rx="14"/>
    <rect x="0" y="0" width="6" height="150" fill="url(#accent3)" rx="14"/>
    <text x="30" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F7F7F4">Voice</text>
    <text x="30" y="70" font-family="system-ui, sans-serif" font-size="13.5" fill="#A1A1AA">A wake word, live conversations, dictation into any app, and phone calls. You can interrupt mid-sentence. Works with local and hosted STT/TTS.</text>
    <text x="30" y="98" font-family="system-ui, sans-serif" font-size="12.5" fill="#D97706">• Push-to-talk · wake word · interruptible · multilingual</text>

    <!-- Computer Use -->
    <rect x="600" y="0" width="540" height="150" fill="url(#card)" stroke="#333" rx="14"/>
    <rect x="600" y="0" width="6" height="150" fill="url(#accent4)" rx="14"/>
    <text x="630" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F7F7F4">Computer Use</text>
    <text x="630" y="70" font-family="system-ui, sans-serif" font-size="13.5" fill="#A1A1AA">Jarvis clicks, types and reads the screen on your desktop and in your browser. You decide what it may do — nothing acts without a live grant.</text>
    <text x="630" y="98" font-family="system-ui, sans-serif" font-size="12.5" fill="#DB2777">• Appshots · screen context · browser control · permission gates</text>
  </g>

  <g transform="translate(60, 450)">
    <!-- Marketplace -->
    <rect x="0" y="0" width="540" height="150" fill="url(#card)" stroke="#333" rx="14"/>
    <rect x="0" y="0" width="6" height="150" fill="url(#accent1)" rx="14"/>
    <text x="30" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F7F7F4">Marketplace</text>
    <text x="30" y="70" font-family="system-ui, sans-serif" font-size="13.5" fill="#A1A1AA">More than 40 plugins, MCP servers, skills and CLI tools installed with one click — GitHub, Google Workspace, Notion, Slack, Linear, Spotify, Home Assistant and more.</text>
    <text x="30" y="98" font-family="system-ui, sans-serif" font-size="12.5" fill="#7C3AED">• One-click install · OAuth browser auth · publisher-provisioned clients</text>

    <!-- Memory & Routines -->
    <rect x="600" y="0" width="540" height="150" fill="url(#card)" stroke="#333" rx="14"/>
    <rect x="600" y="0" width="6" height="150" fill="url(#accent2)" rx="14"/>
    <text x="630" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F7F7F4">Memory &amp; Routines</text>
    <text x="630" y="70" font-family="system-ui, sans-serif" font-size="13.5" fill="#A1A1AA">A local wiki Jarvis reads, writes and cites. Routines repeat on a schedule — morning briefings, inbox sweeps, nightly reports — on subscriptions or local models.</text>
    <text x="630" y="98" font-family="system-ui, sans-serif" font-size="12.5" fill="#059669">• Local wiki · citations · scheduled work · background policy</text>
  </g>

  <g transform="translate(60, 630)">
    <!-- Any Model -->
    <rect x="0" y="0" width="1080" height="120" fill="url(#card)" stroke="#333" rx="14"/>
    <rect x="0" y="0" width="6" height="120" fill="url(#accent3)" rx="14"/>
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F7F7F4">Any Model</text>
    <text x="30" y="68" font-family="system-ui, sans-serif" font-size="13.5" fill="#A1A1AA">OpenAI, Anthropic, Gemini, OpenRouter, NVIDIA, Ollama and any local server, or your Claude and ChatGPT subscriptions. Pick a different model for each task.</text>
    <text x="30" y="96" font-family="system-ui, sans-serif" font-size="12.5" fill="#D97706">• Per-task model selection · local-first option · no vendor lock-in</text>
  </g>

  <text x="600" y="770" font-family="system-ui, sans-serif" font-size="14" fill="#666" text-anchor="middle">Free, open source, runs on your machine — Windows, macOS, Linux, or headless server.</text>
</svg>
