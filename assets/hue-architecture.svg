<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)" rx="0"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#F7F7F4" text-anchor="middle">Hue — Agentic AI Desktop App</text>
  <text x="600" y="78" font-family="system-ui, sans-serif" font-size="16" fill="#A1A1AA" text-anchor="middle">Coding agents • Voice • Computer use • Agents • Marketplace • Memory</text>

  <!-- Core engine -->
  <rect x="60" y="120" width="260" height="120" fill="url(#card)" stroke="#333" rx="12"/>
  <text x="190" y="150" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">Core Engine</text>
  <text x="190" y="178" font-family="system-ui, sans-serif" font-size="13" fill="#F7F7F4" text-anchor="middle">jarvis serve • EventBus • Router</text>
  <text x="190" y="202" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle">Headless &amp; desktop modes</text>

  <!-- Agentic IDE -->
  <rect x="350" y="120" width="280" height="120" fill="url(#card)" stroke="#333" rx="12"/>
  <text x="490" y="150" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle">Agentic IDE</text>
  <text x="490" y="178" font-family="system-ui, sans-serif" font-size="13" fill="#F7F7F4" text-anchor="middle">Claude • Codex • OpenCode • Cursor</text>
  <text x="490" y="202" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle">Kimi • GLM • Grok • DeepSeek</text>
  <text x="490" y="224" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle">Kilo Code • Zed Code</text>

  <!-- Jarvis Agents -->
  <rect x="660" y="120" width="260" height="120" fill="url(#card)" stroke="#333" rx="12"/>
  <text x="790" y="150" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">Jarvis Agents</text>
  <text x="790" y="178" font-family="system-ui, sans-serif" font-size="13" fill="#F7F7F4" text-anchor="middle">Mission workers • Worktrees</text>
  <text x="790" y="202" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle">Review flow • Memory</text>

  <!-- Voice -->
  <rect x="950" y="120" width="190" height="120" fill="url(#card)" stroke="#333" rx="12"/>
  <text x="1045" y="150" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">Voice</text>
  <text x="1045" y="178" font-family="system-ui, sans-serif" font-size="13" fill="#F7F7F4" text-anchor="middle">Wake word • Dictation</text>
  <text x="1045" y="202" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle">Calls • Interrupt</text>

  <!-- Marketplace -->
  <rect x="350" y="270" width="280" height="120" fill="url(#card)" stroke="#333" rx="12"/>
  <text x="490" y="300" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#D97706" text-anchor="middle">Marketplace</text>
  <text x="490" y="328" font-family="system-ui, sans-serif" font-size="13" fill="#F7F7F4" text-anchor="middle">40+ plugins • MCP servers</text>
  <text x="490" y="352" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle">Skills • CLI tools</text>

  <!-- Computer Use -->
  <rect x="660" y="270" width="260" height="120" fill="url(#card)" stroke="#333" rx="12"/>
  <text x="790" y="300" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#DB2777" text-anchor="middle">Computer Use</text>
  <text x="790" y="328" font-family="system-ui, sans-serif" font-size="13" fill="#F7F7F4" text-anchor="middle">Click • Type • Read screen</text>
  <text x="790" y="352" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle">Desktop + Browser</text>

  <!-- Memory -->
  <rect x="950" y="270" width="190" height="120" fill="url(#card)" stroke="#333" rx="12"/>
  <text x="1045" y="300" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">Memory</text>
  <text x="1045" y="328" font-family="system-ui, sans-serif" font-size="13" fill="#F7F7F4" text-anchor="middle">Local wiki • Citations</text>
  <text x="1045" y="352" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle">Cross-session</text>

  <!-- OS support -->
  <rect x="60" y="420" width="260" height="100" fill="url(#card)" stroke="#333" rx="12"/>
  <text x="190" y="450" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#F7F7F4" text-anchor="middle">Runs Everywhere</text>
  <text x="190" y="478" font-family="system-ui, sans-serif" font-size="13" fill="#A1A1AA" text-anchor="middle">Windows • macOS • Linux</text>
  <text x="190" y="498" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle">Headless server mode</text>

  <!-- Arrows -->
  <line x1="320" y1="180" x2="350" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="180" x2="660" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="180" x2="950" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="240" x2="190" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerWidth="6" markerHeight="6">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="600" y="650" font-family="system-ui, sans-serif" font-size="14" fill="#666" text-anchor="middle">Hue — open-source AI agent super-app · Runs on your machine · No cloud between you and your models</text>
</svg>
